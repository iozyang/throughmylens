services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc ready local
        mc mb --ignore-existing "local/$${S3_PRIVATE_BUCKET}"
        mc mb --ignore-existing "local/$${S3_PUBLIC_BUCKET}"
        mc stat "local/$${S3_PRIVATE_BUCKET}"
        mc stat "local/$${S3_PUBLIC_BUCKET}"

  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_ORIGINS: ${WEB_ORIGINS}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS}
      IMAGE_WORKER_ENABLED: "false"
      EXIFTOOL_PATH: exiftool
      PHOTO_MAX_UPLOAD_MB: ${PHOTO_MAX_UPLOAD_MB:-30}
      PHOTO_MAX_MEGAPIXELS: ${PHOTO_MAX_MEGAPIXELS:-60}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BROWSER_ENDPOINT_URL: http://localhost:9000
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
      S3_PUBLIC_BASE_URL: http://localhost:9000/${S3_PUBLIC_BUCKET}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  image-worker:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
      S3_PUBLIC_BASE_URL: http://localhost:9000/${S3_PUBLIC_BUCKET}
    volumes:
      - ./apps/api:/app
    command: python -m app.photos.worker
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
