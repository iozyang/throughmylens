[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "throughmylens-api"
version = "0.1.0"
description = "API for throughmylens.icu"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.141,<0.142",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.11,<3",
  "pwdlib[argon2]>=0.3,<1",
  "python-multipart>=0.0.20,<1",
  "Pillow==12.3.0",
  "pyvips[binary]==3.2.0",
  "pyvips-binary==8.18.6",
  "sqlalchemy>=2.0.45,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
